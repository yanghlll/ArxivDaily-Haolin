[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mts-daily-arxiv"
version = "0.1.0"
description = "Parse and fetch daily MTS arXiv paper digests"
requires-python = ">=3.10"

[project.scripts]
mts-daily-arxiv = "mts_daily_arxiv.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
